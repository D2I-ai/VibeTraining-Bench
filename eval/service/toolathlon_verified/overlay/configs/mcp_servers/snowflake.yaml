# snowflake
# Source: https://github.com/isaacwasserman/mcp-snowflake-server
# Toolathlon Version: https://github.com/lockon-n/mcp-snowflake-server
type: stdio
name: snowflake
params:
  command: uvx
  args:
    # Three pins fix the py3.13 cold start:
    # - mcp<2: mcp 2.x renamed FastMCP -> MCPServer (mcp_snowflake_server
    #   imports the old name)
    # - pyopenssl>=24: old pyopenssl references X509_V_FLAG_NOTIFY_POLICY,
    #   removed from cryptography's bindings
    # - setuptools<81: snowflake.snowpark imports pkg_resources, which
    #   setuptools >=81 dropped
    - "--with"
    - "setuptools<81"
    - "--with"
    - "pyopenssl>=24"
    - "--with"
    - "mcp<2"
    - "mcp_snowflake_server"
    - "--account"
    - "${token.snowflake_account}"
    - "--warehouse"
    - "${token.snowflake_warehouse}"
    - "--user"
    - "${token.snowflake_user}"
    - "--private_key_path"
    - "${token.snowflake_private_key_path}"
    - "--role"
    - "${token.snowflake_role}"
    - "--database"
    - "${token.snowflake_database}"
    - "--schema"
    - "${token.snowflake_schema}"
    - "--allowed_databases"
    - "${token.snowflake_op_allowed_databases}"
    - "--allow_write"
    - "--exclude-json-results"
  cwd: "${agent_workspace}"
client_session_timeout_seconds: 120
cache_tools_list: true