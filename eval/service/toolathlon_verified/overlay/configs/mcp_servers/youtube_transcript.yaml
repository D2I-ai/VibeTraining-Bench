# YouTube Transcript
# Source: https://github.com/jkawamoto/mcp-youtube-transcript
# Toolathlon Version: The same
type: stdio
name: youtube-transcript
params:
  command: uvx
  args:
    # mcp<2: mcp 2.x renamed FastMCP -> MCPServer (mcp_youtube_transcript
    # imports the old name and crashes at import time without this pin)
    - "--with"
    - "mcp<2"
    - "--from"
    - "mcp-youtube-transcript"
    - "mcp-youtube-transcript"
  cwd: "${agent_workspace}"
client_session_timeout_seconds: 10
cache_tools_list: true