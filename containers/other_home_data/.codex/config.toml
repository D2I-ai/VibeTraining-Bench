# Codex CLI settings for the agent sandbox. Copied into the agent's home by
# src/run_task.sh, so it applies to every codex run and nothing else.

# The agent's workspace lives under /home/agent (VTB_AGENT_HOME); without this codex
# stops on its own trust prompt on the first edit and the run ends having done nothing.
[projects."/home/"]
trust_level = "trusted"

[shell_environment_policy]
# Inherit the container's environment as it is. run_task.sh passes HOME, HF_HOME and
# the credentials in with -e, and the image supplies PATH, LD_LIBRARY_PATH and the CUDA
# versions. Hard-setting those here instead means keeping a second copy of the image's
# environment in a config file, which goes stale silently when the base image changes
# -- and a wrong LD_LIBRARY_PATH or a replaced PATH breaks the agent's tools rather
# than reporting anything.
inherit = "all"
# CI=1 keeps the tools the agent shells out to non-interactive; there is no terminal
# here to answer a prompt.
set = { CI = "1" }
